# Release: publish the npm packages and the crates for a tagged version, then create the
# GitHub release. Modelled on archon's public release.yml, itself modelled on nightseam's,
# which is the org's public release shape.
#
# What is published, and where:
#   npm        @bitspark/deixis-core, @bitspark/deixis-pos     (npmjs, with provenance)
#   crates.io  bitspark-deixis-core, bitspark-deixis-pos       (library names deixis_core, deixis_pos)
#   Go         nothing is uploaded: the module proxy fetches github.com/bitspark/deixis from
#              this repository on demand, so the TAG is the Go release.
#   Python     source-only; nothing is published.
# The set profile (`set/`) is source-only in both registries, as it was before the move.
#
# deixis is ONE Go module at the repository root, so a release is ONE tag, `vX`. archon's
# trap (GitHub fires no push event for a push creating more than three tags) cannot arise.
#
# Secrets, as repository secrets (neither is inherited, and neither should be):
#   NPM_TOKEN             — a granular npm token for the @bitspark scope; first publish only
#   CARGO_REGISTRY_TOKEN  — a crates.io token; first publish only
# After the first publish of each name, configure trusted publishing (OIDC) on both
# registries, set the repository variable CRATES_IO_TRUSTED_PUBLISHING to true, and
# delete the tokens.
#
# Runners are GitHub-hosted, without exception.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "The version to publish or rehearse, e.g. v0.6.0."
        required: true
      rehearse:
        description: "true = build, check and pack, but publish NOTHING and create no release."
        required: false
        default: "true"

permissions:
  contents: write   # create the GitHub release
  id-token: write   # npm provenance and crates.io trusted publishing mint from OIDC

jobs:
  release:
    runs-on: ubuntu-latest
    # Every run, a tag's or a rehearsal's, waits here for the reviewer the environment
    # names before a step runs. A publish cannot be taken back: a version burned on npm or
    # crates.io stays burned. The environment is also what a trusted publisher is scoped to.
    environment: release
    timeout-minutes: 45
    env:
      TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
      REHEARSE: ${{ github.event_name == 'workflow_dispatch' && inputs.rehearse || 'false' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.tag }}
          fetch-depth: 0

      - name: Hold the remote tag to the checked-out commit
        # A dispatch takes a tag NAME; compare explicitly rather than trusting the checkout.
        run: |
          set -euo pipefail
          git fetch --tags --force
          remote=$(git rev-list -n1 "$TAG")
          head=$(git rev-parse HEAD)
          [ "$remote" = "$head" ] || { echo "::error::$TAG is $remote but HEAD is $head" >&2; exit 1; }
          echo "releasing $TAG at $head"

      - name: Hold every manifest version to the tag
        # Six manifests carry a version. A release in which one disagrees publishes two
        # different things under one name.
        run: |
          set -euo pipefail
          want="${TAG#v}"
          fail=0
          for f in core/ts/package.json pos/ts/package.json set/ts/package.json; do
            got=$(node -p "require('./$f').version")
            [ "$got" = "$want" ] || { echo "::error::$f is $got, tag says $want"; fail=1; }
          done
          for f in core/rs/Cargo.toml pos/rs/Cargo.toml set/rs/Cargo.toml; do
            got=$(grep -m1 '^version = ' "$f" | sed 's/version = "\(.*\)"/\1/')
            [ "$got" = "$want" ] || { echo "::error::$f is $got, tag says $want"; fail=1; }
          done
          exit $fail

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Rust toolchain
        run: rustup update --no-self-update stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: npm new enough for trusted publishing
        # OIDC publishing needs npm >= 11.5.1; the failure mode of an older npm is a silent
        # fall back to token auth.
        run: |
          npm install -g npm@^11.5.1
          echo "npm $(npm --version), node $(node --version)"

      - name: The four cores pass the corpus
        # The release gate is the one every push runs. A version that cannot demonstrate it
        # is not publishable in any language.
        run: |
          set -euo pipefail
          cargo build --locked -p deixis-conformance
          (cd core/ts && npm ci && npm run build)
          (cd pos/ts && npm ci && npm run build)
          (cd set/ts && npm ci && npm run build)
          node tools/conformance/harness.mjs

      - name: Check what provenance needs
        # npm provenance requires a PUBLIC repository; fail here with a sentence rather than
        # at `npm publish` with a token error.
        run: |
          set -euo pipefail
          vis=$(gh repo view "$GITHUB_REPOSITORY" --json visibility --jq .visibility)
          [ "$vis" = "PUBLIC" ] || { echo "::error::repository is $vis; npm provenance requires PUBLIC" >&2; exit 1; }
          echo "public repository and id-token: write; provenance can be minted"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish to npm
        # Neither package depends on the other, so order is irrelevant; the floor goes first
        # by convention. A version already on the registry is skipped, so a re-run after a
        # partial failure completes the release rather than failing on what succeeded.
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          DRY=""; [ "$REHEARSE" = "true" ] && DRY="--dry-run"
          for d in core/ts pos/ts; do
            ( cd "$d"
              PKG=$(node -p "require('./package.json').name")
              VER=$(node -p "require('./package.json').version")
              if npm view "$PKG@$VER" version >/dev/null 2>&1; then
                echo "$PKG@$VER already on the registry; skipping"
              else
                npm publish --access public --provenance $DRY
              fi )
          done

      # crates.io trusted publishing: exchange this run's OIDC identity for a short-lived
      # token. It works only once a trusted publisher exists for the crate, which needs the
      # crate to exist, which needs one token-based first publish.
      - name: Mint a crates.io token from this run's identity
        id: cratesio-auth
        if: vars.CRATES_IO_TRUSTED_PUBLISHING == 'true'
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.cratesio-auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail
          DRY=""; [ "$REHEARSE" = "true" ] && DRY="--dry-run"
          # crates.io accepts an upload before it serves it; wait for the index rather than
          # sleeping a guess, so a later crate never races an earlier one.
          wait_for_index() {
            pkg="$1"; ver="$2"
            for i in $(seq 1 30); do
              if curl -sf -A "deixis-release (github.com/Bitspark/deixis)" \
                   "https://crates.io/api/v1/crates/$pkg/$ver" >/dev/null 2>&1; then
                echo "  $pkg@$ver is on the index (after ${i}0s)"; return 0
              fi
              sleep 10
            done
            echo "::error::$pkg@$ver never appeared on the crates.io index" >&2; return 1
          }
          for c in core/rs pos/rs; do
            pkg=$(grep -m1 '^name = ' "$c/Cargo.toml" | sed 's/name = "\(.*\)"/\1/')
            if curl -sf -A "deixis-release (github.com/Bitspark/deixis)" \
                 "https://crates.io/api/v1/crates/$pkg/${TAG#v}" >/dev/null 2>&1; then
              echo "$pkg@${TAG#v} already on crates.io; skipping"; continue
            fi
            (cd "$c" && cargo publish $DRY --locked)
            # An `if`, not `[ -z "$DRY" ] && …`: as the loop's last command that test is the
            # step's exit status, and in a rehearsal it is 1, so every rehearsal failed here.
            if [ -z "$DRY" ]; then wait_for_index "$pkg" "${TAG#v}"; fi
          done

      - name: The round trip against what was published
        if: env.REHEARSE != 'true'
        # "On the registry" is a claim until an install from nothing proves it.
        run: |
          set -euo pipefail
          VER="${TAG#v}"
          d=$(mktemp -d); cd "$d"; npm init -y >/dev/null
          # npm accepts a publish before its read path serves it; give the CDN real time,
          # and make a failure say which half is at fault.
          ok=0
          for i in $(seq 1 30); do
            if npm install --no-audit --no-fund "@bitspark/deixis-core@$VER" 2>/dev/null; then ok=1; break; fi
            echo "registry not serving @bitspark/deixis-core@$VER yet (try $i/30); waiting"; sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::@bitspark/deixis-core@$VER did not become installable within 5 minutes. The publish step SUCCEEDED; check the registry before assuming the release failed." >&2
            exit 1
          fi
          node --input-type=module -e "
            import * as d from '@bitspark/deixis-core';
            import * as c from '@bitspark/deixis-core/codec';
            if (!Object.keys(d).length || !Object.keys(c).length) throw new Error('empty module');
            console.log('@bitspark/deixis-core exports ' + Object.keys(d).length + ', /codec exports ' + Object.keys(c).length);
          "

      - name: Create the GitHub release
        if: env.REHEARSE != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="docs/releases/${TAG}.md"
          if [ -f "$notes" ]; then
            gh release create "$TAG" --title "deixis $TAG" --notes-file "$notes" --verify-tag
          else
            gh release create "$TAG" --title "deixis $TAG" --generate-notes --verify-tag
          fi

      - name: What a rehearsal did not do
        if: env.REHEARSE == 'true'
        run: |
          echo "REHEARSAL: nothing was published and no release was created."
          echo "The tag, the six manifest versions, the corpus against four cores and both"
          echo "dry-run packs were checked. Re-run with rehearse=false to publish."
